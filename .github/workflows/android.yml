name: Build Siffle Trouve APK

on:
  workflow_dispatch:
  push:
    branches: ["principal", "main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Décompresser le projet
        run: |
          mkdir project
          unzip -o SiffleTrouve_V2_Online.zip -d project

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Installer Android SDK
        uses: android-actions/setup-android@v3

      - name: Installer les composants Android
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Générer Gradle Wrapper
        working-directory: project
        run: gradle wrapper --gradle-version 8.9

      - name: Compiler l'application
        working-directory: project
        run: ./gradlew assembleDebug

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: SiffleTrouve-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
